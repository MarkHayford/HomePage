    <script>      document.documentElement.classList.add("js");
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("lang");
          var stored = localStorage.getItem("0nyx-lang");
          var lang = q === "en" || q === "zh" ? q : stored === "en" || stored === "zh" ? stored : "zh";
          if (q === "en" || q === "zh") localStorage.setItem("0nyx-lang", q);
          document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
          document.documentElement.setAttribute("data-lang", lang);
          setTimeout(function () { document.documentElement.classList.add("i18n-ready"); }, 2500);
        } catch (e) {}
      })();</script>
